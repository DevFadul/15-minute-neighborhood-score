{% extends "base.html" %}
{% block title %}Edit {{ assessment.nickname }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-slate-900 mb-6">Edit Assessment</h1>

<form method="post" class="max-w-2xl card p-6 space-y-5">
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Nickname</label>
    <input type="text" name="nickname" required value="{{ form.get('nickname', '') }}" class="input-field">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Location note</label>
    <input type="text" name="location_note" value="{{ form.get('location_note', '') }}" class="input-field">
  </div>

  <div class="pt-2 border-t border-slate-100">
    <p class="text-sm text-slate-500 mb-3">One-way walking time (minutes):</p>
    <div class="grid gap-4 sm:grid-cols-2">
      {% for key, info in categories.items() %}
        <div>
          <label class="flex items-center gap-2 text-sm font-medium text-slate-700 mb-1">
            <span class="w-6 h-6 rounded-md bg-{{ category_accents[key] }}-100 text-{{ category_accents[key] }}-600 p-1 shrink-0">
              {{ category_icons[key] }}
            </span>
            {{ info.label }}
          </label>
          <input type="number" step="0.5" min="0" max="{{ max_minutes }}" name="{{ key }}" required
                 value="{{ form.get(key, '') }}" class="input-field">
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="flex gap-3">
    <button type="submit" class="btn-primary">Save Changes</button>
    <a href="{{ url_for('main.detail', assessment_id=assessment.assessment_id) }}" class="btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
